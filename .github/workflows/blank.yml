# This is a basic workflow to help you get started with Actions
name: Build RebuiltDroid Tux Boot-Preserved ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rebuild-boot-preserving.sh'
      - 'branding/**'
      - '.github/workflows/build-boot-preserved-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android-x86 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools curl cpio gzip e2fsprogs zip

      - name: Download Android 10 x64 base ISO
        run: |
          curl -L --fail --retry 5 \
            'https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso' \
            -o android10.iso

      - name: Build boot-preserved ISO
        env:
          BASE_ISO: android10.iso
        run: |
          bash scripts/rebuild-boot-preserving.sh

      - name: Check build outputs
        run: |
          test -f out-preserve/RebuiltDroid-Tux-Android10-preserved.iso
          test -f out-preserve/rebuilt-el-torito.txt
          test -f out-preserve/rebuilt-system-area.txt
          test -f out-preserve/iso-tree.tar.gz

      - name: Package ISO and metadata
        run: |
          mkdir -p package/RebuiltDroid-Tux
          cp out-preserve/RebuiltDroid-Tux-Android10-preserved.iso package/RebuiltDroid-Tux/
          cp out-preserve/rebuilt-el-torito.txt package/RebuiltDroid-Tux/
          cp out-preserve/rebuilt-system-area.txt package/RebuiltDroid-Tux/
          cp out-preserve/iso-tree.tar.gz package/RebuiltDroid-Tux/
          printf '%s\n' \
            'RebuiltDroid Tux Android 10' \
            'Boot-preserving build' \
            > package/RebuiltDroid-Tux/BUILD_INFO.txt
          cd package
          zip -r ../RebuiltDroid-Tux-Android10-boot-preserved.zip RebuiltDroid-Tux

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-boot-preserved-ISO
          path: out-preserve/RebuiltDroid-Tux-Android10-preserved.iso
          if-no-files-found: error

      - name: Upload updated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-boot-preserved-ZIP
          path: RebuiltDroid-Tux-Android10-boot-preserved.zip
          if-no-files-found: error
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
