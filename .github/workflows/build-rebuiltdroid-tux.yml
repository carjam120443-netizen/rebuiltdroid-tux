name: Build RebuiltDroid Tux ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'branding/**'
      - '.github/workflows/build-rebuiltdroid-tux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RebuiltDroid Tux
        uses: actions/checkout@v4

      - name: Install Android-x86 ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            squashfs-tools \
            e2fsprogs \
            android-sdk-libsparse-utils \
            cpio \
            gzip \
            curl \
            imagemagick

      - name: Download Android 10 x64 base
        run: |
          curl -L --fail --retry 5 \
            'https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso' \
            -o android10.iso

      - name: Download Tux branding asset
        run: |
          mkdir -p branding/assets
          curl -L --fail --retry 5 \
            'https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg' \
            -o branding/assets/tux.svg
          convert -background none branding/assets/tux.svg branding/assets/tux.png

      - name: Build RebuiltDroid Tux
        env:
          BASE_ISO: android10.iso
          BASE_URL: https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso
        run: bash scripts/build-android10-x86.sh

      - name: Show build output
        run: |
          find out -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload RebuiltDroid Tux ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-x64
          path: out/RebuiltDroid-Tux-Android10.iso
          if-no-files-found: error

      - name: Upload build filesystems and metadata
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-build-files
          path: |
            out/filesystems/**
            out/BUILD_INFO.txt
          if-no-files-found: warn
