name: Build RebuiltDroid Tux Android 10

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Direct URL to an Android 10 ISO you are licensed to download/rebuild'
        required: false
        type: string
      base_iso:
        description: 'Repository-local ISO filename (normally supplied as an artifact/input in a custom runner)'
        required: false
        default: 'android10.iso'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools p7zip-full cpio gzip curl

      - name: Download base Android 10 ISO
        env:
          BASE_URL: ${{ inputs.base_url }}
          BASE_ISO: ${{ inputs.base_iso }}
        run: |
          if [ -n "$BASE_URL" ]; then
            curl -L --fail --retry 3 "$BASE_URL" -o "$BASE_ISO"
          fi
          test -f "$BASE_ISO" || {
            echo 'No Android 10 ISO supplied.'
            echo 'Provide a licensed/redistributable base ISO URL with base_url, or place the ISO in the repository/runner as android10.iso.'
            exit 2
          }

      - name: Build RebuiltDroid Tux
        env:
          BASE_ISO: ${{ inputs.base_iso }}
        run: bash scripts/build-android10.sh

      - name: Upload ISO and extracted filesystems
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10
          path: out/
          if-no-files-found: error
