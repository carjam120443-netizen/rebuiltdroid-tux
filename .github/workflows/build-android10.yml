name: Build RebuiltDroid Tux Android 10

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Android 10 x64 ISO URL (defaults to the Archive.org Android-x86 image)'
        required: false
        default: 'https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android-x86 image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools curl cpio gzip e2fsprogs android-sdk-libsparse-utils

      - name: Download Android 10 x64 base ISO
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: curl -L --fail --retry 3 "$BASE_URL" -o android10.iso

      - name: Build RebuiltDroid Tux
        env:
          BASE_ISO: android10.iso
          BASE_URL: ${{ inputs.base_url }}
        run: bash scripts/build-android10-x86.sh

      - name: Upload RebuiltDroid Tux ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-x64
          path: out/
          if-no-files-found: error
