name: Build RebuiltDroid Tux Android 10

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Android 10 x64 ISO URL (defaults to the Archive.org Android-x86 image)'
        required: false
        default: 'https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android-x86 image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools curl cpio gzip e2fsprogs android-sdk-libsparse-utils

      - name: Download Android 10 x64 base ISO
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: curl -L --fail --retry 3 "$BASE_URL" -o android10.iso

      - name: Verify base Android Package Manager framework
        env:
          BASE_ISO: android10.iso
        run: bash scripts/verify-package-manager.sh

      - name: Build RebuiltDroid Tux
        env:
          BASE_ISO: android10.iso
          BASE_URL: ${{ inputs.base_url }}
        run: bash scripts/build-android10-x86.sh

      - name: Verify rebuilt Android Package Manager framework
        env:
          BASE_ISO: out/RebuiltDroid-Tux-Android10.iso
        run: bash scripts/verify-package-manager.sh

      - name: Confirm ISO output exists
        run: |
          test -f out/RebuiltDroid-Tux-Android10.iso
          test -f out/filesystems/system.sfs
          ls -lh out/RebuiltDroid-Tux-Android10.iso out/filesystems/system.sfs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-ISO
          path: out/RebuiltDroid-Tux-Android10.iso
          if-no-files-found: error

      - name: Upload filesystem
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-Filesystem
          path: out/filesystems/system.sfs
          if-no-files-found: error

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-Build-Info
          path: out/BUILD_INFO.txt
          if-no-files-found: error
