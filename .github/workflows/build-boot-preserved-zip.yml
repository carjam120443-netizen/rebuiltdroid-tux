name: Build RebuiltDroid Tux Boot-Preserved ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rebuild-boot-preserving.sh'
      - 'branding/**'
      - '.github/workflows/build-boot-preserved-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android-x86 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            squashfs-tools \
            curl \
            cpio \
            gzip \
            e2fsprogs \
            zip

      - name: Download Android 10 x64 base ISO
        run: |
          curl -L --fail --retry 5 \
            'https://archive.org/download/androidx86-10-isos/Android%2010%20x64%20%28Eng%29.iso' \
            -o android10.iso

      - name: Verify downloaded ISO
        run: |
          test -s android10.iso
          ls -lh android10.iso

      - name: Build boot-preserved ISO
        env:
          BASE_ISO: android10.iso
        run: |
          bash scripts/rebuild-boot-preserving.sh

      - name: Check build outputs
        run: |
          echo "Checking generated files..."

          test -s out-preserve/RebuiltDroid-Tux-Android10-preserved.iso
          test -s out-preserve/rebuilt-el-torito.txt
          test -s out-preserve/rebuilt-system-area.txt
          test -s out-preserve/iso-tree.tar.gz

          echo "All required build outputs exist:"
          ls -lh out-preserve/

      - name: Package ISO and metadata
        run: |
          rm -rf package
          mkdir -p package/RebuiltDroid-Tux

          cp \
            out-preserve/RebuiltDroid-Tux-Android10-preserved.iso \
            package/RebuiltDroid-Tux/

          cp \
            out-preserve/rebuilt-el-torito.txt \
            package/RebuiltDroid-Tux/

          cp \
            out-preserve/rebuilt-system-area.txt \
            package/RebuiltDroid-Tux/

          cp \
            out-preserve/iso-tree.tar.gz \
            package/RebuiltDroid-Tux/

          printf '%s\n' \
            'RebuiltDroid Tux Android 10' \
            'Boot-preserving build' \
            'Android-x86 based' \
            > package/RebuiltDroid-Tux/BUILD_INFO.txt

          cd package

          zip -r \
            ../RebuiltDroid-Tux-Android10-boot-preserved.zip \
            RebuiltDroid-Tux

      - name: Show ZIP
        run: |
          ls -lh RebuiltDroid-Tux-Android10-boot-preserved.zip

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-preserved-ISO
          path: out-preserve/RebuiltDroid-Tux-Android10-preserved.iso
          if-no-files-found: error

      - name: Upload boot-preserved ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltDroid-Tux-Android10-boot-preserved-ZIP
          path: RebuiltDroid-Tux-Android10-boot-preserved.zip
          if-no-files-found: error
